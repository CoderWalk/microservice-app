spring.application.name=Cloud-Gateway
server.port=8989

# --- Eureka Configuration ---
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true

# --- Eureka Instance Fix ---
#eureka.instance.instance-id=Cloud-Gateway:8989
#eureka.instance.hostname=localhost
#eureka.instance.prefer-ip-address=false

# --- Gateway Routes for Order-Service (Updated Keys) ---
spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://Order-Service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/order/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=orderServiceCB
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/orderFallback

# --- Gateway Routes for Payment-Service (Updated Keys) ---
spring.cloud.gateway.server.webflux.routes[1].id=payment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://Payment-Service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/payment/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=paymentServiceCB
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/paymentFallback

# --- Resilience4j Timeout Configurations ---
spring.cloud.circuitbreaker.resilience4j.instances.orderServiceCB.timelimiter.timeout-duration=10s
resilience4j.timelimiter.instances.orderServiceCB.cancel-running-future=true

spring.cloud.circuitbreaker.resilience4j.instances.paymentServiceCB.timelimiter.timeout-duration=10s
resilience4j.timelimiter.instances.paymentServiceCB.cancel-running-future=true